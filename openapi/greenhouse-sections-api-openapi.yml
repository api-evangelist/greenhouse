openapi: 3.2.0
info:
  title: Greenhouse Job Board Sections API
  description: The Job Board API enables building careers pages with custom look and feel. Read endpoints (GET) require no authentication; submitting an application (POST) requires HTTP Basic Auth with the board's API key.
  version: '1.0'
  contact:
    name: Greenhouse Developer Support
    url: https://developers.greenhouse.io/job-board.html
servers:
- url: https://boards-api.greenhouse.io/v1/boards/{board_token}
  description: Production
  variables:
    board_token:
      default: example
      description: The board token issued by Greenhouse for the organization.
tags:
- name: Sections
paths:
  /sections:
    get:
      tags:
      - Sections
      summary: List prospect sections
      responses:
        '200':
          description: Prospect sections and postings
  /sections/{section_id}:
    parameters:
    - in: path
      name: section_id
      required: true
      schema:
        type: integer
    get:
      tags:
      - Sections
      summary: Retrieve prospect section
      responses:
        '200':
          description: Section with prospect posts
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
