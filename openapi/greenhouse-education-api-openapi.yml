openapi: 3.2.0
info:
  title: Greenhouse Job Board Education API
  description: The Job Board API enables building careers pages with custom look and feel. Read endpoints (GET) require no authentication; submitting an application (POST) requires HTTP Basic Auth with the board's API key.
  version: '1.0'
  contact:
    name: Greenhouse Developer Support
    url: https://developers.greenhouse.io/job-board.html
servers:
- url: https://boards-api.greenhouse.io/v1/boards/{board_token}
  description: Production
  variables:
    board_token:
      default: example
      description: The board token issued by Greenhouse for the organization.
tags:
- name: Education
paths:
  /education/degrees:
    get:
      tags:
      - Education
      summary: List degrees
      responses:
        '200':
          description: Available degree types
  /education/disciplines:
    get:
      tags:
      - Education
      summary: List disciplines
      responses:
        '200':
          description: Field of study options
  /education/schools:
    get:
      tags:
      - Education
      summary: List schools
      responses:
        '200':
          description: Educational institutions
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
